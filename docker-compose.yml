services:

  api:
    image: armageddon.local/docker-local/armageddon-api:latest
    container_name: armageddon-api
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      # Put secrets in a .env file at the repo root (never commit it):
      #   Jwt__Key=<your-strong-secret-here>
      #   Kestrel__Certificates__Default__Password=<your-pfx-password>
      - Jwt__Key=${Jwt__Key:?Jwt__Key env var must be set}
      - Jwt__Issuer=Armageddon.Api
      - ASPNETCORE_ENVIRONMENT=Production
      - App__HttpPort=8080
      - App__HttpsPort=8443
      - Kestrel__Certificates__Default__Path=/app/certs/armageddon.pfx
      - Kestrel__Certificates__Default__Password=${Kestrel__Certificates__Default__Password:?Certificate password must be set}
      # Uncomment the next lines to enable verbose startup logging for diagnostics:
      #- Logging__LogLevel__Armageddon.Api=Debug
      #- Logging__LogLevel__Microsoft.Hosting.Lifetime=Debug
      #- Logging__LogLevel__Microsoft.AspNetCore.Server.Kestrel=Debug
    volumes:
      - /opt/armageddon/data:/app/data
      - /opt/armageddon/certs:/app/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://localhost:8443/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    image: armageddon.local/docker-local/armageddon-web:latest
    container_name: armageddon-web
    ports:
      - "8081:8080"
      - "8444:8443"
    environment:
      # Put secrets in a .env file at the repo root (never commit it):
      #   Kestrel__Certificates__Default__Password=<your-pfx-password>
      - ApiBaseUrl=https://api:8443
      - ApiCertThumbprint=
      - PublicHttpsPort=8444
      - App__HttpPort=8080
      - App__HttpsPort=8443
      - ASPNETCORE_ENVIRONMENT=Production
      - Kestrel__Certificates__Default__Path=/app/certs/armageddon.pfx
      - Kestrel__Certificates__Default__Password=${Kestrel__Certificates__Default__Password:?Certificate password must be set}
      # PublicHttpsPort must match the host-side port mapping (left side of "8444:8443")
      # so UseHttpsRedirection sends browsers to the correct external port.
      # Uncomment the lines below to enable verbose diagnostics when needed:
      #- Logging__LogLevel__Armageddon.Web=Debug
      #- Logging__LogLevel__Microsoft.AspNetCore.Components=Debug
      #- Logging__LogLevel__Microsoft.AspNetCore.Components.Server.Circuits=Debug
      #- Logging__LogLevel__Microsoft.AspNetCore.SignalR=Debug
      #- Logging__LogLevel__Microsoft.Hosting.Lifetime=Debug
    volumes:
      - /opt/armageddon/web-data:/app/data
      - /opt/armageddon/certs:/app/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: armageddon-network
